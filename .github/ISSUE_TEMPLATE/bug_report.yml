name: Signaler un bug
description: Déclarer un dysfonctionnement reproductible dans Horizon.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Merci de fournir suffisamment de détails pour reproduire et diagnostiquer le problème.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez clairement le problème rencontré.
      placeholder: Que s'est-il passé ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Donnez une suite d'étapes numérotées et reproductibles.
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Résultat observé
      description: Indiquez le comportement réellement obtenu.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
      description: Indiquez le comportement qui aurait dû se produire.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production
        - Développement local
        - Firestore Emulator
        - Autre
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Appareil
      description: Précisez le modèle et le système d'exploitation.
      placeholder: Exemple : Pixel 8, Android 16
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navigateur ou PWA
      description: Précisez le navigateur et sa version, ou indiquez PWA installée.
      placeholder: Exemple : Chrome 138 ou PWA Android
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures éventuelles
      description: Ajoutez des captures expurgées de toute donnée sensible si elles facilitent le diagnostic.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Niveau de priorité
      options:
        - Critique — utilisation bloquée ou données menacées
        - Haute — fonctionnalité importante indisponible
        - Normale — contournement possible
        - Faible — gêne mineure ou cosmétique
    validations:
      required: true
